<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Poker Polacco Online</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #1a252f; color: #ecf0f1; margin: 0; padding: 20px; }
        h1, h2, h3 { margin-bottom: 10px; }
        #game-screen { display: none; position: relative; }
        
        .card { display: inline-block; padding: 15px 25px; margin: 5px; background: white; color: #2c3e50; border-radius: 8px; font-weight: bold; font-size: 24px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .red { color: #e74c3c; }

        .controls { background: #2c3e50; padding: 25px; border-radius: 15px; display: inline-block; margin-top: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: 0.3s; max-width: 400px; width: 100%; }
        #action-controls { pointer-events: none; opacity: 0.5; }
        
        .input-group { display: flex; flex-direction: column; text-align: left; margin-bottom: 15px; }
        .input-group label { font-size: 14px; color: #bdc3c7; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        select { padding: 12px; border-radius: 8px; border: 2px solid #34495e; background: #ecf0f1; font-size: 16px; color: #2c3e50; outline: none; cursor: pointer; }
        .hidden { display: none !important; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 15px; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.2s; color: white; }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
        
        .btn-blue { background: #3498db; }
        .btn-red { background: #e74c3c; }
        .btn-green { background: #27ae60; margin-bottom: 20px;}

        #turn-alert { font-size: 22px; font-weight: bold; margin: 15px 0; padding: 10px; border-radius: 8px; display: inline-block; }
        
        .login-box { background: #2c3e50; padding: 40px; border-radius: 15px; display: inline-block; margin-top: 100px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .login-box input { display: block; width: 80%; margin: 10px auto; padding: 12px; border-radius: 8px; border: none; font-size: 16px; text-align: center; }

        .top-right-summary { position: fixed; top: 20px; right: 20px; background: rgba(44, 62, 80, 0.95); border: 2px solid #34495e; border-radius: 10px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: left; min-width: 180px; z-index: 1000; display: none; }
        .top-right-summary h4 { margin: 0 0 10px 0; color: #f1c40f; text-transform: uppercase; font-size: 13px; border-bottom: 1px solid #7f8c8d; padding-bottom: 8px; text-align: center; }
        .player-row { margin-bottom: 8px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
        .player-row .p-name { font-weight: bold; }
        .player-row .p-cards { background: #e74c3c; color: white; padding: 2px 8px; border-radius: 12px; font-size: 13px; font-weight: bold; }
        
        .eliminated-row { opacity: 0.4; text-decoration: line-through; }
        .eliminated-tag { background: #7f8c8d !important; }
    </style>
</head>
<body>
    <div id="login-screen" class="login-box">
        <h1 style="color: #f1c40f;">♠♥ Poker Polacco ♦♣</h1>
        <input type="text" id="playerName" placeholder="Il tuo nome (es. Marco)">
        <input type="text" id="roomCode" placeholder="Codice Stanza (es. 1234)">
        <button class="btn-blue" style="width: 85%; margin-top: 15px;" onclick="joinRoom()">Entra nel Tavolo</button>
    </div>

    <!-- Pannello Riepilogo -->
    <div id="top-summary" class="top-right-summary">
        <h4>Giocatori al Tavolo</h4>
        <div id="players-list-content"></div>
    </div>

    <div id="game-screen">
        <h2 style="color: #bdc3c7;">Stanza: <span id="room-display" style="color: white;"></span></h2>
        
        <button class="btn-green" onclick="startGame()">♠ Distribuisci Carte (Nuovo Round) ♠</button>
        
        <div style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 10px; margin-top: 10px;">
            <h3 style="color: #95a5a6; margin-top: 0;">Le tue carte:</h3>
            <div id="my-cards" style="min-height: 60px;"></div>
        </div>
        
        <h3 style="font-size: 24px; margin-top: 25px;">Ultima chiamata: <span id="current-bid" style="color: #f1c40f;">Nessuna</span></h3>
        
        <div id="turn-alert">In attesa di iniziare...</div>

        <!-- Comandi -->
        <div class="controls" id="action-controls">
            <div class="input-group">
                <label>Combinazione:</label>
                <select id="bidType" onchange="updateMenuVisibility()">
                    <option value="Carta Alta">Carta Alta</option>
                    <option value="Coppia">Coppia</option>
                    <option value="Doppia Coppia">Doppia Coppia</option>
                    <option value="Tris">Tris</option>
                    <option value="Full">Full</option>
                    <option value="Poker">Poker</option>
                    <option value="Colore">Colore</option>
                </select>
            </div>
            
            <div class="input-group" id="group-val1">
                <label id="label-val1">Valore Carta:</label>
                <select id="bidVal1">
                    <option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="J">Jack (J)</option><option value="Q">Regina (Q)</option><option value="K">Re (K)</option><option value="A">Asso (A)</option>
                </select>
            </div>

            <div class="input-group hidden" id="group-val2">
                <label id="label-val2">Secondo Valore:</label>
                <select id="bidVal2">
                    <option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="J">Jack (J)</option><option value="Q">Regina (Q)</option><option value="K">Re (K)</option><option value="A">Asso (A)</option>
                </select>
            </div>
            
            <div class="input-group hidden" id="group-suit">
                <label>Seleziona il Seme:</label>
                <select id="bidSuit">
                    <option value="♠">Picche (♠)</option><option value="♥">Cuori (♥)</option><option value="♦">Quadri (♦)</option><option value="♣">Fiori (♣)</option>
                </select>
            </div>

            <div class="btn-group">
                <button class="btn-blue" onclick="makeBid()">Rilancia ⬆</button>
                <button class="btn-red" onclick="callBluff()">DUBITO! 🛑</button>
            </div>
        </div>
        
        <div id="showdown-result" style="margin-top: 30px; font-size: 20px; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 15px; display: none;"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myRoom = '';
        let myName = '';

        function updateMenuVisibility() {
            const type = document.getElementById('bidType').value;
            const groupVal1 = document.getElementById('group-val1');
            const groupVal2 = document.getElementById('group-val2');
            const groupSuit = document.getElementById('group-suit');
            const labelVal1 = document.getElementById('label-val1');
            const labelVal2 = document.getElementById('label-val2');

            groupVal1.classList.add('hidden'); groupVal2.classList.add('hidden'); groupSuit.classList.add('hidden');

            if (type === 'Colore') {
                groupSuit.classList.remove('hidden');
            } else if (type === 'Doppia Coppia' || type === 'Full') {
                groupVal1.classList.remove('hidden'); groupVal2.classList.remove('hidden');
                labelVal1.innerText = (type === 'Full') ? 'Tris di:' : 'Coppia di:';
                labelVal2.innerText = (type === 'Full') ? 'E Coppia di:' : 'E seconda Coppia di:';
            } else {
                groupVal1.classList.remove('hidden');
                labelVal1.innerText = `Valore (${type}):`;
            }
        }

        function getCardHTML(cardString) {
            let colorClass = (cardString.includes('♥') || cardString.includes('♦')) ? 'red' : '';
            return `<div class="card ${colorClass}">${cardString}</div>`;
        }

        function toggleControls(turnName) {
            const controls = document.getElementById('action-controls');
            const alert = document.getElementById('turn-alert');
            
            if (myName === turnName) {
                controls.style.pointerEvents = 'auto';
                controls.style.opacity = '1';
                alert.innerText = "👉 È IL TUO TURNO! Fai una chiamata.";
                alert.style.color = "#2ecc71";
                alert.style.background = "rgba(46, 204, 113, 0.2)";
            } else {
                controls.style.pointerEvents = 'none';
                controls.style.opacity = '0.5';
                alert.innerText = `⏳ In attesa di ${turnName}...`;
                alert.style.color = "#e74c3c";
                alert.style.background = "rgba(231, 76, 60, 0.2)";
            }
        }

        function joinRoom() {
            myName = document.getElementById('playerName').value;
            myRoom = document.getElementById('roomCode').value;
            
            if (myName && myRoom) {
                socket.emit('join_room', { name: myName, room: myRoom });
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                document.getElementById('top-summary').style.display = 'block';
                document.getElementById('room-display').innerText = myRoom;
                updateMenuVisibility();
            }
        }

        function startGame() {
            document.getElementById('showdown-result').style.display = "none";
            socket.emit('start_game', myRoom);
        }

        function makeBid() {
            const type = document.getElementById('bidType').value;
            const val1 = document.getElementById('bidVal1').value;
            const val2 = document.getElementById('bidVal2').value;
            const suit = document.getElementById('bidSuit').value;
            
            let text = `${type} di ${val1}`;
            if (type === 'Doppia Coppia' || type === 'Full') text += ` e ${val2}`;
            if (type === 'Colore') text = `${type} di ${suit}`;

            socket.emit('make_bid', { room: myRoom, bid: { type, val1, val2, suit, text } });
        }

        function callBluff() {
            socket.emit('call_bluff', myRoom);
        }

        socket.on('update_players', (players) => {
            document.getElementById('players-list-content').innerHTML = players.map(p => {
                if (p.isEliminated) {
                    return `<div class="player-row eliminated-row">
                                <span class="p-name">💀 ${p.name}</span>
                                <span class="p-cards eliminated-tag">OUT</span>
                            </div>`;
                } else {
                    return `<div class="player-row">
                                <span class="p-name">👤 ${p.name}</span>
                                <span class="p-cards">🃏 ${p.penalties}</span>
                            </div>`;
                }
            }).join('');
        });

        socket.on('game_started', ({ turn }) => {
            document.getElementById('current-bid').innerText = `Nessuna (Inizia il giro!)`;
            toggleControls(turn);
        });

        socket.on('deal_cards', (cards) => {
            if (cards.length === 0) {
                document.getElementById('my-cards').innerHTML = "<h4 style='color:#e74c3c; margin:0;'>Sei stato eliminato 💀<br><span style='font-size:14px; color:#bdc3c7; font-weight:normal;'>Puoi assistere fino alla fine della partita.</span></h4>";
            } else {
                document.getElementById('my-cards').innerHTML = cards.map(c => getCardHTML(c)).join('');
            }
        });

        socket.on('bid_updated', ({ bid, nextTurn }) => {
            document.getElementById('current-bid').innerText = `${bid}`;
            toggleControls(nextTurn);
        });

        socket.on('showdown', (data) => {
            document.getElementById('action-controls').style.pointerEvents = 'none';
            document.getElementById('action-controls').style.opacity = '0.5';
            
            const alert = document.getElementById('turn-alert');
            alert.innerText = "🏁 Round terminato. Clicca su Distribuisci Carte per continuare.";
            alert.style.color = "#f1c40f";
            alert.style.background = "rgba(241, 196, 15, 0.2)";

            let resultDiv = document.getElementById('showdown-result');
            resultDiv.style.display = "block";

            let resultHTML = "";

            if (data.gameOver) {
                resultHTML += `<h2 style="color: #f1c40f; font-size: 32px; border: 2px dashed #f1c40f; padding: 15px;">🏆 IL VINCITORE ASSOLUTO È ${data.gameWinner}! 🏆</h2>`;
                alert.innerText = "Partita Conclusa! Premi Distribuisci Carte per ricominciare da zero.";
            }

            if (data.eliminatedName) {
                resultHTML += `<div style="background: rgba(231, 76, 60, 0.2); border: 2px solid #e74c3c; padding: 10px; margin-bottom: 20px; border-radius: 8px;">
                                <h3 style="color: #e74c3c; margin: 0;">🚨 ${data.eliminatedName.toUpperCase()} È STATO ELIMINATO! 🚨</h3>
                               </div>`;
            }

            resultHTML += `<h3 style="color:${data.bidExists ? '#2ecc71' : '#e74c3c'}; font-size: 28px;">`;
            resultHTML += data.bidExists ? `✔ Punto Trovato! "${data.bidText}" era VERA.` : `❌ Bluff Scoperto! "${data.bidText}" era FALSA.`;
            resultHTML += `</h3>`;
            
            resultHTML += `<p style="font-size: 18px;">🏆 <strong>Vince la manche:</strong> ${data.winner}</p>`;
            resultHTML += `<p style="font-size: 18px; color: #e74c3c;">💀 <strong>Perde la manche:</strong> ${data.loser}</p>`;
            
            resultHTML += `<hr style="border-color: #7f8c8d; margin: 20px 0;"><h4 style="color: #bdc3c7;">Carte scoperte:</h4>`;
            
            data.players.forEach(p => {
                resultHTML += `<div style="margin-bottom: 10px;">
                    <span style="display: inline-block; width: 100px; text-align: right; margin-right: 15px; font-weight: bold;">${p.name}:</span>` 
                    + p.cards.map(c => getCardHTML(c)).join('') + `</div>`;
            });

            resultDiv.innerHTML = resultHTML;
            document.getElementById('my-cards').innerHTML = ""; 
        });

        // Evento per l'espulsione da parte dell'admin
        socket.on('kicked', (reason) => {
            alert(reason); 
            window.location.reload(); 
        });
    </script>
</body>
</html>
